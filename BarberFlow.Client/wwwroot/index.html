<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow | Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>BarberFlow <span>// Booking</span></h1>

        <div class="card" id="step-1">
            <div class="form-group">
                <label>01. Выберите услугу</label>
                <select id="serviceSelect"></select>
            </div>
            <div class="form-group">
                <label>02. Выберите мастера</label>
                <select id="masterSelect"></select>
            </div>
            <div class="form-group">
                <label>03. Дата</label>
                <input type="date" id="dateInput">
            </div>
            <button id="btn-find-slots">Сканировать время</button>
        </div>

        <div class="card hidden" id="step-2">
            <h3>Доступные слоты</h3>
            <div class="slots" id="slotsContainer"></div>

            <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 25px;">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="clientName" placeholder="Иван">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="clientPhone" placeholder="+7 (999) 000-00-00">
                </div>
                <button id="btn-book" disabled>Подтвердить запись</button>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>

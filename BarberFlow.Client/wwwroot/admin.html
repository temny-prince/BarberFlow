<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow | Control Center</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Дополнительные стили для вкладок */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            text-transform: uppercase;
            width: auto;
        }

            .tab:hover {
                color: var(--text);
            }

            .tab.active {
                color: var(--primary);
                border-bottom: 2px solid var(--primary);
            }

        .tab-content {
            display: none;
        }

            .tab-content.active {
                display: block;
            }
    </style>
</head>
<body>
    <div class="container wide">
        <div class="header-flex">
            <h1>BarberFlow <span>// Control</span></h1>
            <div>
                <span id="adminName" style="margin-right: 15px; color: var(--text-muted); font-size: 14px;"></span>
                <button id="btn-logout" class="btn-small btn-danger">Выйти</button>
            </div>
        </div>

        <!-- Вкладки (ОБРАТИ ВНИМАНИЕ НА ПЕРЕДАЧУ this) -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('appointments', this)">Записи</button>
            <button class="tab" onclick="switchTab('services', this)">Услуги</button>
            <button class="tab" onclick="switchTab('masters', this)">Мастера</button>
        </div>

        <!-- Вкладка 1: Записи -->
        <div id="tab-appointments" class="tab-content active">
            <div class="card">
                <h3>Все записи</h3>
                <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr><th>Дата и Время</th><th>Клиент</th><th>Мастер</th><th>Услуга</th><th>Статус</th><th>Действия</th></tr>
                        </thead>
                        <tbody id="tableBodyAppointments"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Вкладка 2: Услуги -->
        <div id="tab-services" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>Услуги</h3>
                    <button class="btn-small btn-accent" onclick="addService()">+ Добавить услугу</button>
                </div>
                <table class="admin-table">
                    <thead><tr><th>Название</th><th>Цена (₽)</th><th>Длительность (мин)</th><th>Действия</th></tr></thead>
                    <tbody id="tableBodyServices"></tbody>
                </table>
            </div>
        </div>

        <!-- Вкладка 3: Мастера -->
        <div id="tab-masters" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>Мастера</h3>
                    <button class="btn-small btn-accent" onclick="addMaster()">+ Добавить мастера</button>
                </div>
                <table class="admin-table">
                    <thead><tr><th>Имя</th><th>Телефон</th><th>Действия</th></tr></thead>
                    <tbody id="tableBodyMasters"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно графика (ПЕРЕНЕСЕНО ДО СКРИПТОВ) -->
    <div id="scheduleModal" class="cmp-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div class="card" style="width: 500px; max-width: 90%;">
            <h3 style="margin-bottom: 20px;">График работы: <span id="scheduleMasterName" style="color: var(--primary);"></span></h3>

            <div id="scheduleDays" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <!-- Сюда JS сгенерирует дни недели -->
            </div>

            <div style="display: flex; gap: 10px;">
                <button onclick="saveSchedule()" class="btn-accent" style="flex: 1;">Сохранить</button>
                <button onclick="document.getElementById('scheduleModal').style.display = 'none'" style="flex: 1;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Скрипты в самом конце -->
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
